<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Useless Compliment Machine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAHUlEQVQYV2NkYGD4z8DAwMgwE4MHDx5c6GBgANcNAF/5Awl8qL0OAAAAAElFTkSuQmCC') repeat;
      background-color: #ff00ff;
      font-family: 'Comic Sans MS', 'Comic Neue', cursive;
      overflow: hidden;
    }
    .blink {
      animation: blink 0.5s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .rainbow-text {
      background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 5s linear infinite;
    }
    @keyframes rainbow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    .spin {
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-center p-4">
  <div class="bg-yellow-300 border-8 border-black p-8 rounded-none shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] relative">
    <h1 class="text-6xl font-bold rainbow-text mb-6">Super Useless Compliment Machine</h1>
    <p class="text-2xl text-purple-800 font-bold mb-4 blink">A Proud <a href="https://theuselessweb.com" target="_blank" class="underline hover:text-red-600">Useless Web</a> Project!</p>
    <p id="compliment" class="text-3xl text-blue-600 font-bold mb-8 p-6 bg-white bg-opacity-80 border-4 border-dashed border-red-500 rounded-lg">
      Smash the button for useless vibes!
    </p>
    <button id="generateBtn" class="bg-lime-400 text-black font-bold text-2xl py-4 px-10 border-6 border-black hover:bg-lime-600 transition transform hover:scale-125 spin">
      GIMME A COMPLIMENT!
    </button>
  </div>
  <footer class="mt-8 text-white text-lg bg-black bg-opacity-50 p-2">
    <p>&copy; 2025 Epic Forge Technologies. All rights reserved.</p>
  </footer>
  <script>
    const compliments = [
      "You're a galactic legend in a world of mere mortals!",
      "Your aura is like a Wi-Fi signal—full bars everywhere!",
      "You shine so bright, stars file complaints!",
      "You're cooler than a popsicle in a snowstorm!",
      "Your existence breaks the awesomeness scale!",
      "You’re a glitter explosion in a boring universe!",
      "Your vibes make rainbows jealous!",
      "You're the human equivalent of a double rainbow!",
      "You’re so epic, myths are written about you!",
      "You make chaos look like a masterpiece!"
    ];

    const sounds = [
      new Audio('https://www.myinstants.com/media/sounds/wow.mp3'),
      new Audio('https://www.myinstants.com/media/sounds/oh-yeah.mp3'),
      new Audio('https://www.myinstants.com/media/sounds/boom.mp3')
    ];

    const complimentElement = document.getElementById('compliment');
    const generateBtn = document.getElementById('generateBtn');

    function getRandomCompliment() {
      const randomIndex = Math.floor(Math.random() * compliments.length);
      complimentElement.textContent = compliments[randomIndex];
      complimentElement.classList.add('animate-bounce');
      generateBtn.classList.add('spin');
      setTimeout(() => {
        complimentElement.classList.remove('animate-bounce');
        generateBtn.classList.remove('spin');
      }, 1000);
      const randomSound = sounds[Math.floor(Math.random() * sounds.length)];
      randomSound.play().catch(e => console.log('Sound blocked:', e));
    }

    generateBtn.addEventListener('click', getRandomCompliment);
  </script>
</body>
</html>
